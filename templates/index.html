<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Vision Real-Time Prediction</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 40px 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: #aaaaaa;
            margin-bottom: 40px;
            text-align: center;
        }
        .video-container {
            border: 4px solid #333333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background-color: #000;
            position: relative;
        }
        img {
            display: block;
            max-width: 100%;
            height: auto;
        }
        .footer {
            margin-top: 50px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>Sign Language Recognition</h1>
    <p class="subtitle">Real-time gesture predictions using MediaPipe and LSTM.</p>

    <div class="video-container">
        <!-- The image source points to our Flask video feed endpoint -->
        <img src="{{ url_for('video_feed') }}" alt="Webcam Feed Loading...">
    </div>

    <div class="footer">
        Powered by TensorFlow, Keras, MediaPipe, and OpenCV.
    </div>

</body>
</html>
